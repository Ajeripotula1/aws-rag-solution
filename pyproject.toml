[project]
name = "aws-rag-solution"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.119",
    "botocore[crt]>=1.43.119",
    "python-dotenv>=1.2.4",
    "strands-agents>=1.63.0",
]

[project.scripts]
aws-rag-solution = "aws_rag_solution:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
